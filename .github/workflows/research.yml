name: Nigeria Problem Radar Research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: problem-radar-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research agent
        run: python -m agent.run
        env:
          PROBLEM_RADAR_DAYS: "7"
          PROBLEM_RADAR_MAX_ITEMS_PER_SOURCE: "40"
          PROBLEM_RADAR_LOOKBACK_HOURS: "48"

      - name: Commit research results
        run: |
          git config user.name "problem-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No new research data to commit."
          else
            git commit -m "chore: update problem radar research"
            git push origin main
          fi
