name: Problem Radar Business Validation Map
on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build business opportunity map
        run: python -m agent.business_opportunity
      - name: Build validation plan
        run: python -m agent.research_plan
      - name: Commit outputs
        run: |
          git config user.name 'problem-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/business_opportunities.json data/validation_plan.json reports/business-opportunity-map.md reports/validation-plan.md
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'chore: update business validation map'; git push origin main; fi
