name: Problem Radar Evidence Resolution Queue
on:
  workflow_dispatch:
  schedule:
    - cron: '47 12 * * 1'
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build evidence resolution queue
        run: python -m agent.evidence_resolution
      - name: Commit queue
        run: |
          git config user.name 'problem-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evidence_resolution_queue.json reports/evidence-resolution-queue.md
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'chore: update evidence resolution queue'; git push origin main; fi
