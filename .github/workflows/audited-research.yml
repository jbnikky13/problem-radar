name: Problem Radar Audited Research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover canonical research state
        run: python -m agent.recover_research
      - name: Build audited clusters
        run: python -m agent.cluster_audit
      - name: Build opportunity dossiers
        run: python -m agent.opportunity_dossiers
      - name: Build business opportunity map
        run: python -m agent.business_opportunity
      - name: Build validation plan
        run: python -m agent.research_plan
      - name: Commit generated research
        run: |
          git config user.name 'problem-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then echo 'No generated changes.'; else git commit -m 'chore: rebuild canonical research intelligence'; git push origin main; fi
