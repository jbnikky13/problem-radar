name: Problem Radar Cross Problem Analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '57 9 * * 1'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect shared mechanisms
        run: python -m agent.cross_problem
      - name: Commit analysis
        run: |
          git config user.name 'problem-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cross_problem_patterns.json reports/cross-problem-patterns.md
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'chore: update cross problem patterns'; git push origin main; fi
