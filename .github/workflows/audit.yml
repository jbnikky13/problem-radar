name: Problem Radar Evidence Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run audit
        run: python -c "from agent.audit import run_audit; print(run_audit())"
      - name: Commit audit
        run: |
          git config user.name "problem-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit.json reports/evidence-audit.md
          if git diff --cached --quiet; then
            echo "No audit changes."
          else
            git commit -m "chore: update evidence audit"
            git push origin main
          fi
